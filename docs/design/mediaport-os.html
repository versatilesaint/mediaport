<title>MediaPort OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: OS shell. Menubar on top, free-window desktop (tiles on tablet, one app at a time on phone), magnifying dock at the bottom.
   Shell themes swap only the --shell tokens below. On-air graphics use the organisation brand tokens (--bp/--bd/--ba/--bf/--bm/--bl) and never the shell theme. */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root{
  --bg:#eef2f7; --w1:#9cc3ff; --w2:#ffd3e8; --w3:#c8f2e4;
  --surf:rgba(255,255,255,.72); --surf2:#f6f8fb; --fg:#14202e; --mut:#5a6878;
  --acc:#2563eb; --acc2:#db2777; --on-acc:#ffffff;
  --line:color-mix(in srgb, var(--fg) 13%, transparent);
  --soft:color-mix(in srgb, var(--fg) 6%, transparent);
  --shadow:0 28px 70px -24px rgba(10,14,30,.45), 0 2px 8px rgba(10,14,30,.10);
  --ok:#16a34a; --amber:#f59e0b; --orange:#f97316; --bad:#ef4444; --grace:#8b5cf6;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-ui:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r-win:16px; --r-ctl:11px; --bar:46px; --dockh:86px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0618; --w1:#3b1d78; --w2:#e0337f; --w3:#ff8a3d;
    --surf:rgba(29,18,56,.74); --surf2:#140c2a; --fg:#f4efff; --mut:#a99cc8;
    --acc:#f7ba49; --acc2:#e0337f; --on-acc:#1a1030; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0618; --w1:#3b1d78; --w2:#e0337f; --w3:#ff8a3d;
  --surf:rgba(29,18,56,.74); --surf2:#140c2a; --fg:#f4efff; --mut:#a99cc8;
  --acc:#f7ba49; --acc2:#e0337f; --on-acc:#1a1030; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Wallpaper: aurora blobs + dot grid + 3D floor ---------- */
.wall{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--bg)}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.55;will-change:transform}
.blob.b1{background:radial-gradient(circle at center,var(--w1) 0,transparent 62%);left:-20vmax;top:-25vmax;animation:drift1 32s ease-in-out infinite alternate}
.blob.b2{background:radial-gradient(circle at center,var(--w2) 0,transparent 62%);right:-25vmax;top:-10vmax;opacity:.42;animation:drift2 38s ease-in-out infinite alternate}
.blob.b3{background:radial-gradient(circle at center,var(--w3) 0,transparent 62%);left:20vmax;bottom:-40vmax;opacity:.45;animation:drift1 44s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-10vmax,12vmax) scale(.92)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.1px,transparent 1.4px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%)}
.floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:60%;transform:perspective(600px) rotateX(72deg);transform-origin:50% 100%;
  background-image:linear-gradient(to right,color-mix(in srgb,var(--acc) 30%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--acc) 30%,transparent) 1px,transparent 1px);
  background-size:70px 70px;animation:floor 6s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 0,transparent 85%);mask-image:linear-gradient(to top,#000 0,transparent 85%);opacity:.55}
@keyframes floor{to{background-position:0 70px}}
.wm{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font:700 clamp(60px,12vw,180px)/1 var(--f-display);letter-spacing:-.03em;color:color-mix(in srgb,var(--fg) 6%,transparent);white-space:nowrap;user-select:none}

/* ---------- Menubar ---------- */
.menubar{position:fixed;left:0;right:0;top:0;z-index:50;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surf2) 72%,transparent);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
.logo{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.logo .mk{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 12px -4px var(--acc2);position:relative}
.logo .mk::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2.5px solid var(--on-acc);border-right-color:transparent}
.grad{background:linear-gradient(92deg,var(--fg) 10%,var(--acc) 55%,var(--acc2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mb-btn{height:34px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border-radius:9px;border:1px solid transparent;background:transparent;font-weight:500;white-space:nowrap}
.mb-btn:hover{background:var(--soft)}
.mb-btn svg{width:17px;height:17px}
.mb-sp{flex:1}
.show-sm{display:none}
.conn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);font-size:13px;font-weight:600;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2.4s infinite}
.conn[data-mode="hub"] .dot{background:var(--amber);--c:var(--amber)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--surf2);margin-left:-7px;color:var(--on-acc);background:var(--acc)}
.av:nth-child(2){background:var(--acc2);color:#fff}
.av:nth-child(3){background:var(--mut);color:var(--surf2)}
.clock{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{position:fixed;z-index:80;min-width:260px;padding:6px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);box-shadow:var(--shadow)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:0;border-radius:9px;background:transparent;min-height:44px}
.menu button:hover,.menu button[aria-current="true"]{background:var(--soft)}
.menu .sw{width:22px;height:22px;border-radius:6px;flex:none}
.menu small{display:block;color:var(--mut);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .log{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.menu .log div{padding:8px 12px;font-size:13px;border-radius:8px}
.menu .log time{color:var(--mut);font-family:var(--f-mono);font-size:12px;margin-right:8px}

/* ---------- Desktop & windows ---------- */
.desktop{position:fixed;z-index:10;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 12px);bottom:calc(var(--dockh) + env(safe-area-inset-bottom,0px) + 8px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.area{position:relative;width:100%;height:100%}
.win{position:absolute;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-win);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);overflow:hidden;animation:winIn .34s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:50% 100%}
.win.focused{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:0 40px 90px -28px rgba(10,14,30,.55),0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent)}
.win.closing{animation:winOut .2s ease-in both}
@keyframes winIn{from{opacity:0;transform:perspective(900px) translateY(26px) rotateX(10deg) scale(.96)}}
@keyframes winOut{to{opacity:0;transform:translateY(30px) scale(.94)}}
.win.onair::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:5;
  background:conic-gradient(from var(--ang),transparent 0 62%,var(--bad) 78%,var(--acc) 90%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 4.5s linear infinite}
@keyframes beam{to{--ang:360deg}}
.tb{flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;background:color-mix(in srgb,var(--surf2) 35%,transparent)}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:2px}
.lights button{width:24px;height:24px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.lights button i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights .c i{background:#ff5f57}.lights .m i{background:#febc2e}.lights .x i{background:#28c840}
.tb h2{margin:0;font:600 14px var(--f-ui);display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb h2 svg{width:16px;height:16px;color:var(--acc);flex:none}
.tb .tb-sp{flex:1}
.tb .tb-x{font-size:12px;color:var(--mut);white-space:nowrap}
.wb{flex:1;min-height:0;overflow:auto;padding:14px;container-type:inline-size}
.rz{position:absolute;z-index:6;touch-action:none}
.rz.n,.rz.s{left:14px;right:14px;height:7px;cursor:ns-resize}.rz.n{top:0}.rz.s{bottom:0}
.rz.e,.rz.w{top:14px;bottom:14px;width:7px;cursor:ew-resize}.rz.e{right:0}.rz.w{left:0}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:16px;height:16px}
.rz.ne{top:0;right:0;cursor:nesw-resize}.rz.sw{bottom:0;left:0;cursor:nesw-resize}.rz.nw{top:0;left:0;cursor:nwse-resize}
.rz.se{bottom:0;right:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,var(--line) 55% 62%,transparent 62% 72%,var(--line) 72% 79%,transparent 79%)}
.rz:hover{background-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.win.resizing{transition:none;user-select:none}
.zm{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:var(--soft)}
.zm button{border:0;background:transparent;min-width:28px;height:26px;border-radius:6px;font:700 12px var(--f-ui);color:var(--mut)}
.zm button:hover{background:var(--surf2);color:var(--fg)}
.zm span{font:500 11px var(--f-mono);color:var(--mut);min-width:34px;text-align:center}
.org-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.org-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surf2) 70%,transparent)}
.org-row .sw{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 15px var(--f-display)}
.org-row b{display:block}.org-row small{color:var(--mut);font-family:var(--f-mono);font-size:11.5px}
.org-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.org-row.sus{opacity:.6}
.of{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.of .full-row{grid-column:1/-1}
@container (max-width:620px){.of{grid-template-columns:1fr}.org-row{grid-template-columns:38px minmax(0,1fr)}.org-row .acts{grid-column:1/-1;justify-content:flex-start}}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mut)}
.colors input{width:52px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surf2);cursor:pointer}
.err{color:var(--bad);font-size:12px;font-weight:600}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.packs button{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;min-height:64px}
.packs button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.packs b{display:block;font-size:14px}.packs small{color:var(--mut);font-size:12px}

/* ---------- Dock ---------- */
.dock{position:fixed;z-index:60;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:9px 12px;border-radius:22px;
  background:color-mix(in srgb,var(--surf2) 62%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.dk{position:relative;width:var(--dk,54px);height:var(--dk,54px);border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;transform-origin:50% 100%;transition:transform .14s ease-out;
  background:linear-gradient(160deg,color-mix(in srgb,var(--surf2) 92%,var(--acc)),color-mix(in srgb,var(--surf2) 75%,var(--acc2)));color:var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -8px rgba(0,0,0,.5)}
.dk svg{width:26px;height:26px}
.dk[data-app="program"]{background:linear-gradient(160deg,var(--acc),var(--acc2));color:var(--on-acc)}
.dk .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}
.dk .run{position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--fg);opacity:0}
.dk.open .run{opacity:.75}
.dock .sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}

/* ---------- Controls ---------- */
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surf2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--surf2) 85%,var(--fg))}
.btn:active{transform:translateY(1px) scale(.99)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.take{position:relative;overflow:hidden;min-height:58px;min-width:150px;padding:0 26px;border-radius:14px;border:0;font:700 19px var(--f-ui);letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 10px 24px -10px #16a34a,inset 0 1px 0 rgba(255,255,255,.35)}
.take::after{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-80%);animation:shimmer 3.2s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(80%)}}
.take:active{transform:translateY(1px)}
.take small{display:block;font-size:11px;font-weight:500;letter-spacing:.02em;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--mut)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:transparent}
.chip[aria-pressed="true"]::before{background:currentColor}
.chip.plain::before{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.live{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.pill.cue{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.inp{min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--surf2) 80%,transparent);width:100%;box-sizing:border-box}
textarea.inp{min-height:86px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer;min-height:36px}
.switch input{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{transform:translateX(16px)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{border:0;background:transparent;min-height:32px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.muted{color:var(--mut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}

/* ---------- Program (live outputs) ---------- */
.mons{display:grid;grid-template-columns:2.3fr 1fr;grid-template-rows:auto auto;gap:10px}
.mon{min-width:0;background:color-mix(in srgb,var(--surf2) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px}
.mon.big{grid-row:span 2}
.mon-h{display:flex;align-items:center;gap:8px;min-width:0}
.mon-h b{font-size:13px;letter-spacing:.04em}
.mon-h .lat{font:500 11px var(--f-mono);color:var(--mut);margin-left:auto;white-space:nowrap}
.mon-h .x{border:0;background:var(--soft);border-radius:7px;font-size:11px;font-weight:700;padding:4px 8px;color:var(--mut)}
.mon-h .x:hover{color:var(--bad)}
@container (max-width:620px){.mons{grid-template-columns:1fr}.mon.big{grid-row:auto}}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:7px;overflow:hidden;
  background:repeating-conic-gradient(#8d929b 0 25%,#a9adb5 0 50%) 0 0/18px 18px}
.screen.opaque{background:#000}
.canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s,.2));overflow:hidden;font-family:var(--f-ui)}
.screen.ff .canvas{background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--bm) 45%,transparent),transparent 60%),linear-gradient(160deg,var(--bp),var(--bd))}
.screen.bo .canvas>*{display:none}
.screen.bo::after{content:"BLACKOUT";position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#777;font:700 12px var(--f-mono);letter-spacing:.2em}

function take(st,id,silent){
  const it=st.items[id];if(!it) return;
  it.live={...it.data};
  if(it.comp==='countdown') it.live.target=Date.now()+(+it.data.minutes||10)*60000;
  for(const [o] of OUTS){
    const arr=st.onAir[o].filter(x=>x!==id);
    if(it.targets[o]){
      const same=arr.filter(x=>st.items[x]&&st.items[x].slot===it.slot);
      const lim=MULTI[it.slot]||1;
      const drop=same.slice(0,Math.max(0,same.length-lim+1));
      st.onAir[o]=arr.filter(x=>!drop.includes(x)).concat(id);
    } else st.onAir[o]=arr;
  }
  if(it.comp==='transition'||(it.comp==='logo'&&it.slot==='transition')){const tok=it.tok=Math.random();setTimeout(()=>{if(it.tok!==tok)return;clearItem(st,id,true);if(st.slug===ORG)renderOutputs()},2700)}

}

const tmrEl=t=>t.startedAt?((t.pausedAt||Date.now())-t.startedAt-t.pausedTotal):0;

const PHUI={ready:'var(--acc)',running:'var(--ok)',warn5:'var(--amber)',warn2:'var(--orange)',warn1:'var(--bad)',grace:'var(--grace)',overtime:'var(--bad)'};
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
const fmtUp=ms=>{const s=Math.max(0,Math.floor(ms/1000));const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function tmrText(t,short){const r=tmrRem(t),p=tmrPhase(t);if(p==='grace') return 'Grace '+fmt(t.graceMs+r);if(p==='overtime') return '+'+fmtUp(-r)+(short?'':' over');return fmt(r)+(short?' left':'')}
function tmrCheck(st){const t=st.timer;if(!t.startedAt||t.pausedAt) return;const r=tmrRem(t);
  for(const m of t.warns){if(r<=m*60000&&r>0&&!t.fired['w'+m]){t.fired['w'+m]=1;alertT(st,m+' minute'+(m>1?'s':'')+' left',PHUI['warn'+m])}}
  if(r<=0&&!t.fired.up){t.fired.up=1;alertT(st,'Time is up — grace '+fmt(t.graceMs)+' begins',PHUI.grace)}
  if(r<=-t.graceMs&&!t.fired.ot){t.fired.ot=1;alertT(st,'Overtime',PHUI.overtime)}}

    if(el&&el.dataset.sig!==g.sig){el.remove();el=null}

    else{el.style.zIndex=g.z;have.delete(g.k)}

area.addEventListener('pointerdown',e=>{

  const rs=e.target.closest('.rz'),tb=e.target.closest('.tb');if(!rs&&!tb) return;
  const w=W[app];

  e.preventDefault();const sx=e.clientX,sy=e.clientY,o={...w};const A=area.getBoundingClientRect();const d=rs?rs.dataset.d:'';const MW=320,MH=200;
  el.setPointerCapture(e.pointerId);el.classList.add('resizing');
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(rs){
      if(d.includes('e')) w.w=Math.max(MW,Math.min(A.width-o.x,o.w+dx));
      if(d.includes('s')) w.h=Math.max(MH,Math.min(A.height-o.y,o.h+dy));
      if(d.includes('w')){const nx=Math.max(0,Math.min(o.x+o.w-MW,o.x+dx));w.w=o.w+(o.x-nx);w.x=nx}
      if(d.includes('n')){const ny=Math.max(0,Math.min(o.y+o.h-MH,o.y+dy));w.h=o.h+(o.y-ny);w.y=ny}
    }
    else{w.x=Math.max(-w.w+140,Math.min(A.width-140,o.x+dx));w.y=Math.max(0,Math.min(A.height-44,o.y+dy))}
    place(el,w)};
  const up=()=>{el.classList.remove('resizing');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);saveLayout()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
});

    case 'org-menu':menuAt(a,Object.values(ORGS).filter(o=>o.status!=='suspended').map(o=>`<button data-act="org" data-slug="${o.slug}" aria-current="${o.slug===ORG}"><span class="sw" style="background:linear-gradient(135deg,${o.brand.a},${o.brand.m} 60%,${o.brand.p})"></span><span>${esc(o.name)}<small>/${o.slug} · ${esc(o.loc)}</small></span></button>`).join('')+`<hr><div class="muted" style="font-size:12px;padding:6px 12px">Each organisation has its own room, links, team and brand. Nothing is shared.</div><button data-act="org-add"><span class="sw" style="display:grid;place-items:center;border:1px dashed var(--mut);font-weight:700">+</span><span>Add organisation…<small>Platform owner</small></span></button><button data-act="open" data-app="orgs"><span class="sw" style="display:grid;place-items:center;color:var(--acc)">${ico('orgs')}</span><span>Manage organisations</span></button>`);break;
    case 'org':{if(ORGS[a.dataset.slug]?.status==='suspended'){toast('Suspended','Reactivate it first.','var(--amber)');break}switchOrg(a.dataset.slug);toast('Switched organisation',ORGS[ORG].name);break}
    case 'org-add':{closeMenus();openApp('orgs');const n=$('#o-name');if(n){n.closest('.wb').scrollTop=n.closest('.field').offsetTop-60;n.focus()}break}
    case 'org-pack':OD.pack=a.dataset.v;renderOrgs();break;
    case 'org-pre':{const p=BRANDPRE[+a.dataset.i];Object.assign(OD,{cp:p[1],ca:p[2],cm:p[3],cl:p[4]});$$('[data-o="cp"],[data-o="ca"],[data-o="cm"],[data-o="cl"]').forEach(i=>i.value=OD[i.dataset.o]);orgPreview();renderOrgsNote();break}
    case 'org-create':createOrg();break;
    case 'org-reset':OD=blankDraft();renderOrgs();break;
    case 'org-sus':{const o=ORGS[a.dataset.slug];o.status=o.status==='suspended'?'active':'suspended';if(o.status==='suspended'&&ORG===o.slug) switchOrg('photizo');saveOrgs();renderOrgs();toast(o.status==='suspended'?'Suspended':'Reactivated',o.name+(o.status==='suspended'?' — its links and sign-in stop working.':''),'var(--amber)');break}
    case 'org-del':orgDel=a.dataset.slug;renderOrgs();$('#delconf')?.focus();break;
    case 'org-del-cancel':orgDel=null;renderOrgs();break;
    case 'org-del-go':{const sl=a.dataset.slug;if(($('#delconf')?.value||'').trim()!==sl){toast('Not deleted','Type '+sl+' exactly to confirm.','var(--bad)');break}
      const nm=ORGS[sl].name;if(ORG===sl) switchOrg('photizo');delete ORGS[sl];delete S[sl];orgDel=null;saveOrgs();renderOrgs();toast('Deleted',nm+' and everything in it.','var(--bad)');break}
    case 'zoom':{const app=win.dataset.app,w=W[app];const cur=w.zoom||uiZoom();let i=ZOOMS.findIndex(z=>z>=cur-.001);if(i<0) i=ZOOMS.length-1;w.zoom=ZOOMS[Math.max(0,Math.min(ZOOMS.length-1,i+(+a.dataset.d)))];applyZoom(app);saveLayout();break}
    case 'uisize':{uiSize=a.dataset.v;store.set('uisize',uiSize);Object.values(W).forEach(w=>delete w.zoom);applyUiSize();saveLayout();$$('[data-act="uisize"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===uiSize));break}
    case 'themes-menu':{const m=menuAt(a,`<div class="eyebrow" style="padding:6px 12px">Quick switch</div>${['photizo','daylight','dusk','royal','purelight','slate'].map(id=>{const t=THEMES.find(x=>x.id===id);return `<button data-act="theme" data-id="${t.id}" aria-current="${curTheme.id===t.id}"><span class="sw" style="background:linear-gradient(135deg,${t.bg} 40%,${t.acc})"></span><span>${t.name}<small>${t.group}</small></span></button>`}).join('')}<hr><button data-act="open" data-app="themes">All 30 themes…</button>`);break}
    case 'log':menuAt(a,`<div class="eyebrow" style="padding:6px 12px">Activity · ${esc(ORGS[ORG].short)}</div><div class="log">${s.log.map(l=>`<div><time>${l.t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time>${esc(l.msg)}</div>`).join('')||'<div class="muted">Nothing yet</div>'}</div>`);break;
  }
  if(!['org-menu','themes-menu','log'].includes(act)&&!e.target.closest('.menu')) closeMenus();
  if(act==='theme'||act==='open') closeMenus();
});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.tcard');if(c){const s=st();selTpl(+c.dataset.tpl);take(s,s.sel)}});
document.addEventListener('input',e=>{const s=st(),it=s.items[s.sel];
  if(e.target.dataset.o){const k=e.target.dataset.o;OD[k]=e.target.value;
    if(k==='name'&&!OD.slugEdited){OD.slug=slugify(OD.name);const sl=$('#o-slug');if(sl) sl.value=OD.slug}
    if(k==='slug'){OD.slugEdited=true;OD.slug=slugify(e.target.value)}
    const u=$('#o-slug')?.nextElementSibling;if(u) u.innerHTML='mediaport.koladelawal.org/<b>'+esc(OD.slug||'…')+'</b>/control';
    orgPreview();renderOrgsNote();return}
  if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;renderLibrary();const q=$('#libq');q.focus();q.setSelectionRange(pos,pos);return}
  if(e.target.dataset.f&&it){it.data[e.target.dataset.f]=e.target.type==='number'?+e.target.value:e.target.value;renderPreview();if(it.liveTyping&&isOn(s,it.id)){it.live={...it.data,target:it.live.target};renderOutputs()}refreshLive();return}
  if(e.target.id==='livetype'&&it){it.liveTyping=e.target.checked}
  if(e.target.id==='tName'){s.timer.label=e.target.value;renderOutputs()}
  if(e.target.id==='tGrace'){s.timer.graceMs=+e.target.value*60000;tick()}
});
document.addEventListener('change',e=>{if(e.target.id==='tGrace'){st().timer.graceMs=+e.target.value*60000;tick()}if(e.target.id==='livetype'){const it=st().items[st().sel];if(it) it.liveTyping=e.target.checked}});
document.addEventListener('pointermove',e=>{const c=e.target.closest('.tcard');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}},{passive:true});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.target.closest('input,textarea,select')||$('.scrim')) return;
  const s=st(),it=s.items[s.sel];
  if(e.key===' '){e.preventDefault();if(it&&!isOn(s,it.id)) take(s,it.id);else roGo(s,Math.min(s.ro.length-1,s.roIdx+1))}
  else if(e.key==='Escape'){if($('.menu')) closeMenus();else if(it) clearItem(s,it.id)}
  else if(e.key==='ArrowRight') roGo(s,Math.min(s.ro.length-1,s.roIdx+1));
  else if(e.key==='ArrowLeft') roGo(s,Math.max(0,s.roIdx-1));
  else if(/^[1-9]$/.test(e.key)) roGo(s,+e.key-1);
});

/* dock: magnification */
const dock=$('#dock');
dock.innerHTML=Object.entries(APPS).map(([a,l],i)=>(i===5?'<span class="sep"></span>':'')+`<button class="dk" data-act="open" data-app="${a}" aria-label="${l}">${ico(a)}<span class="tip">${l}</span><span class="run"></span></button>`).join('')+`<span class="sep"></span><button class="dk" data-act="palette" aria-label="Search">${ico('search')}<span class="tip">Search · Ctrl K</span></button>`;
dock.addEventListener('pointermove',e=>{if(isPhone()||document.body.classList.contains('lite')||matchMedia('(prefers-reduced-motion: reduce)').matches) return;$$('.dk',dock).forEach(d=>{const r=d.getBoundingClientRect();const dist=Math.abs(e.clientX-(r.left+r.width/2));const s=1+Math.max(0,.5*(1-dist/150));d.style.transform=`scale(${s.toFixed(3)}) translateY(${(-(s-1)*14).toFixed(1)}px)`})});
dock.addEventListener('pointerleave',()=>$$('.dk',dock).forEach(d=>d.style.transform=''));

/* ================= Tick ================= */
function tick(){
  const now=Date.now();const ck=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#clock').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'  '+ck.slice(0,5);
  $$('[data-kind="clock"]').forEach(e=>e.textContent=ck);
  $$('[data-kind="cd"]').forEach(e=>{const r=+e.dataset.t-now;e.textContent=r>0?fmt(r):'Starting'});
  Object.values(S).forEach(tmrCheck);
  const s=st(),t=s.timer,ph=tmrPhase(t),pc=PH[ph][1],used=Math.min(1,tmrEl(t)/t.durationMs);
  $$('[data-kind="timer"]').forEach(e=>e.textContent=tmrText(t,!!e.dataset.short));
  $$('[data-kind="tph"]').forEach(e=>e.textContent=PH[ph][0]);
  $$('[data-kind="tbar"]').forEach(e=>e.parentElement.style.setProperty('--w',(used*100)+'%'));
  $$('.tphase').forEach(e=>{e.dataset.phase=ph;e.style.setProperty('--pc',pc)});
  $$('.tms .bar i').forEach(e=>e.style.width=(used*100)+'%');
  const big=$('#tBig');if(big){const ring=$('#ring'),ui=PHUI[ph];big.textContent=tmrText(t);ring.dataset.phase=ph;ring.style.setProperty('--pc',ui);$('#tPh').textContent=PH[ph][0];$('#tPh').style.setProperty('--pc',ui);
    const rem=tmrRem(t);$('#ringP').style.strokeDashoffset=String(552.9*(1-Math.max(0,Math.min(1,rem/t.durationMs))));const sb=$('#tStart');sb.textContent=!t.startedAt?'Start':t.pausedAt?'Resume':'Pause'}
}

/* ================= Boot ================= */
store.get('orgs',[]).forEach(o=>{if(o&&o.slug&&!ORGS[o.slug]&&o.brand){o.seeded=false;ORGS[o.slug]=o}});
Object.keys(ORGS).forEach(seed);applyUiSize();
(function(){let id=store.get('theme',null);let t=THEMES.find(x=>x.id===id);
  if(!t){const dt=document.documentElement.dataset.theme;const dark=dt?dt==='dark':matchMedia('(prefers-color-scheme: dark)').matches;t=THEMES.find(x=>x.id===(dark?'photizo':'daylight'))}
  applyTheme(t,false);if(store.get('lite',false)) document.body.classList.add('lite')})();
const saved=store.get('layout',null);
if(saved&&!isPhone()&&Object.values(saved).some(w=>w.open)){Object.entries(saved).forEach(([a,w])=>{if(!APPS[a]) return;W[a]={...w,z:++zTop,open:false};if(w.open) openApp(a,false)});focusTop()}
else{tile();if(isPhone()) focusWin('program')}
setInterval(tick,250);tick();
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{if(!isPhone()){const A=area.getBoundingClientRect();Object.entries(W).forEach(([a,w])=>{if(w.x+120>A.width||w.y+44>A.height){tile()}})}},200)});
</script>
