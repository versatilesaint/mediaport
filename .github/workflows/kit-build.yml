# Builds each organisation's broadcast kit in its own brand (studio spec §6), free on GitHub Actions.
# Needs the repository secret KIT_BUILD_TOKEN (same value as the Worker secret). Without it, the job does nothing.
name: Kit builder
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['kit/**', 'apps/cloud/public/assets/frames.js', 'apps/cloud/public/assets/catalog.js', 'apps/cloud/public/assets/graphics.css', '.github/workflows/kit-build.yml']
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every organisation
        type: boolean
        default: false
      only:
        description: Only this organisation (slug)
        required: false
concurrency: { group: kit-build, cancel-in-progress: false }
permissions: { contents: read, statuses: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIT_BUILD_TOKEN: ${{ secrets.KIT_BUILD_TOKEN }}
      MEDIAPORT_URL: https://mediaport.koladelawal.org
      # A push changes how kits are drawn, so every organisation's kit is rebuilt.
      ALL: ${{ (github.event_name == 'push' || inputs.all) && '1' || '' }}
      KIT_SUMMARY: /tmp/kit-summary.txt
      ONLY: ${{ inputs.only }}
    steps:
      - name: Check the token
        id: tok
        run: if [ -n "$KIT_BUILD_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "KIT_BUILD_TOKEN is not set; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok
        with: { node-version: 22 }
      - name: Install Playwright, Chromium and ffmpeg
        if: steps.tok.outputs.ok
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Build kits
        id: build
        if: steps.tok.outputs.ok
        run: node kit/build.mjs
      # The result as a commit status on the commit that ran ("Kit builder"), so it shows on GitHub.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tok.outputs.ok && steps.build.outcome || 'skipped' }}
        run: |
          if [ "$OUTCOME" = "skipped" ]; then STATE=error; DESC="KIT_BUILD_TOKEN is not set in GitHub secrets";
          else DESC="$(cat "$KIT_SUMMARY" 2>/dev/null || echo "$OUTCOME")"; [ "$OUTCOME" = "success" ] && STATE=success || STATE=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="Kit builder" -f description="${DESC:0:139}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
